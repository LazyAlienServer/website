name: Preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  delete-preview:
    # Repository secrets are not available to pull requests from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
      - name: Delete branch Preview
        # `cf previews deploy` names a Preview after the Git branch, so the
        # closing pull request's head branch identifies its Preview. The
        # Worker name matches cloudflare.config.ts.
        #
        # Cloudflare evicts the least recently deployed Preview when a Worker
        # reaches its Preview limit, so a Preview can already be absent.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          set -u -o pipefail
          if output="$(pnpm exec cf previews delete "$PREVIEW_NAME" --worker las-web --force 2>&1)"; then
            printf '%s\n' "$output"
          else
            status=$?
            printf '%s\n' "$output"
            if printf '%s\n' "$output" | grep -q '\[10025\]'; then
              echo "Preview '$PREVIEW_NAME' was already deleted."
            else
              exit "$status"
            fi
          fi
