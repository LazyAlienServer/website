version: 2
updates:
  # pnpm dependencies — Dependabot uses `npm` ecosystem for npm/yarn/pnpm.
  # Detected via package.json + pnpm-lock.yaml + packageManager field.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      - dependency-name: "vite-plus"

  # Keep GitHub Actions up to date (future-proof; no workflows yet)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
